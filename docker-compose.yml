version: '3.8'

services:
  gold-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gold_saas_backend
    restart: always
    ports:
      - "8005:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - GOLD_DATA_DIR=/app/data
    volumes:
      - ./backend/data:/app/data

  gold-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gold_saas_frontend
    restart: always
    ports:
      - "5175:80"
    depends_on:
      - gold-backend
